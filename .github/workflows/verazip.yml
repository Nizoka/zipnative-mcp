name: ISO 21320-1 Validation (veraZIP)

# veraZIP — zipnative-mcp's analogue of pdfnative-mcp's veraPDF gate.
#
# WHAT: the BUILT MCP tool handlers (dist/server.js → `callToolDirect`,
# exactly what `tools/call` runs) write a corpus of 43 archives
# (39 conformant, 4 of which are spec-valid-but-hostile shapes the server
# must refuse, + 4 negative canaries — the numbers docs/data/verazip.json
# declares) under test-output/zip/ + manifest.json
# (scripts/generate-zip-corpus.mjs, corpus defined once in
# scripts/helpers/zip-corpus.mjs) covering every write-side path of the tool
# surface: create_zip store/deflate levels, the empty archive, mixed methods,
# unicode + deep names, insertion / canonical order, comments, extra fields,
# unix modes, pinned and wall-clock dates, the deterministic encoder pin, the
# worker pool, streamed sources (data-descriptor layout), the Zip64 streaming
# opt-in, file mode into the sandbox; modify_zip append-only / compact /
# compact canonical / rename and an SFX prefix; canonicalize_zip; merge_zip …
# plus raw-crafted archives (hostile shapes the server refuses with a ZIP_*
# code, and NEGATIVE CANARIES built byte by byte, never by the engine) that
# the validator MUST reject. scripts/validate-zip.mjs — a vendored copy of
# zipnative's ISO/IEC 21320-1:2015 validator with its own independent raw
# parser (scripts/verazip-core.mjs never imports the engine, so the engine is
# not attesting itself) — then checks every archive clause by clause and
# compares the verdict with the manifest's expectation:
#   level 0  ISO/IEC 21320-1 clause checks + APPNOTE cross-checks
#            (CD↔LFH agreement, offsets, overlap, descriptor width). ALWAYS
#            runs.
#   level 1  foreign integrity pass (unzip -t, 7z t, python -m zipfile
#            -t, bsdtar -tf, jar tf) over the conformant corpus. Absent
#            tools are SKIPped, never simulated.
# An unexpected pass of a canary (XPASS) is fatal, so a validator that
# accepts everything fails the run instead of turning it green. The count
# canary fails the run when the corpus on disk no longer matches
# docs/data/verazip.json.
#
# The gate (ci.yml, publish.yml) runs the same corpus and validator; this
# workflow is the interop job: it records the foreign tools each runner image
# carries and uploads the per-archive reports, so a rejection is attributable
# to "our bug" or to "runner image tool drift".
#
# WHY BLOCKING ON LINUX *AND* WINDOWS: the ZIP the tools write must be the
# same bytes on both platforms (deterministic archives are a semver-major
# contract), the file-mode entries exercise the sandbox on both path
# conventions (`\` separators, reserved device names, case-folded
# collisions), and the level-1 tool set differs per runner image — a
# Windows-only rejection by bsdtar (tar.exe) or a Linux-only one by unzip
# would otherwise go unnoticed. Both matrix entries are required status
# checks (.github/rulesets/main.json). The validate step has no
# `continue-on-error`.
#
# Exit codes of scripts/validate-zip.mjs:
#   0 all expectations met · 1 conformance FAIL / XPASS / level-1
#   rejection / canary drift · 2 no corpus · 3 INFRA (VERAZIP_REQUIRED=1
#   and no level-1 tool usable, or a file produced an INFRA outcome —
#   not a verdict).
#
# No `paths:` filter: a path-filtered workflow that does not run reports
# "Expected — Waiting for status" on a PR and blocks merging when the check is
# required, so this gate runs on every push and PR.
#
# Level-1 tools come from the runner images, never from npm — the package
# keeps its three-runtime-dependency policy (zipnative, the MCP SDK, zod)
# and nothing is downloaded:
#   ubuntu-latest   unzip, 7z (p7zip), python3, jar (Temurin), GNU tar —
#                   NOT bsdtar, so the bsdtar leg reports SKIP on Linux.
#   windows-latest  7z (7-Zip), tar.exe (bsdtar), python, jar (Temurin) —
#                   no unzip, so the unzip leg reports SKIP on Windows.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Weekly, so a runner-image change of the level-1 extractors is seen between pull requests.
  schedule:
    - cron: '41 4 * * 1'
  # Manual runs against any branch from the Actions UI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verazip-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail-closed: zero usable level-1 integrity tools is an INFRA failure
  # (exit 3), never a silent skip that would leave the step green.
  VERAZIP_REQUIRED: '1'
  VERAZIP_REPORT_DIR: test-output/zip/reports

jobs:
  # The job id and the matrix are load-bearing: the main ruleset requires
  # `verazip (ubuntu-latest)` and `verazip (windows-latest)`.
  verazip:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Record tool versions (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          {
            echo '## veraZIP level-1 tool versions (ubuntu-latest)'
            echo '```'
            unzip -v | head -1 || true
            7z i | head -3 || true
            python3 --version || true
            tar --version | head -1 || true
            java -version 2>&1 | head -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record tool versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "## veraZIP level-1 tool versions (windows-latest)" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          & "C:\Program Files\7-Zip\7z.exe" i | Select-Object -First 3 >> $env:GITHUB_STEP_SUMMARY
          tar.exe --version | Select-Object -First 1 >> $env:GITHUB_STEP_SUMMARY
          python --version >> $env:GITHUB_STEP_SUMMARY
          java -version 2>&1 | Select-Object -First 1 >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Build
        run: npm run build

      - name: Generate ZIP corpus
        # Drives the BUILT dist/server.js tool handlers.
        run: npm run corpus:zip

      # BLOCKING (see header). The exit code drives the step outcome; plain
      # redirects only (no process substitution) so the identical script runs
      # under Git Bash on the Windows leg.
      - name: Validate ZIP corpus (blocking)
        id: validate
        shell: bash
        run: |
          set +e
          node scripts/validate-zip.mjs > verazip-report.txt 2> verazip-stderr.txt
          code=$?
          cat verazip-report.txt
          [ -s verazip-stderr.txt ] && cat verazip-stderr.txt >&2
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "${code}"

      # Weekly only, Linux leg: the slow tests — the 256 MiB stdio frame edge and the
      # 4 GiB + 1 Zip64 stream written into the sandbox and read back by ranges — prove
      # the large-archive promise on a real runner (about 8 GiB of disk, minutes). Too
      # slow for every pull request; the publish gate runs them again before a release.
      - name: Slow tests (weekly schedule)
        if: github.event_name == 'schedule' && runner.os == 'Linux'
        env:
          ZIPNATIVE_MCP_SLOW_TESTS: '1'
        run: npx vitest run tests/zip64-streaming.test.ts tests/cli-stdio.test.ts

      # Per-file JSON reports + summary.json live under
      # test-output/zip/reports/ — upload them so a FAIL / INFRA line can be
      # diagnosed without re-running the job.
      - name: Upload veraZIP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verazip-report-${{ runner.os }}
          path: |
            verazip-report.txt
            verazip-stderr.txt
            test-output/zip/manifest.json
            test-output/zip/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.validate.outputs.exit_code }}
          OUTCOME: ${{ steps.validate.outcome }}
        run: |
          case "${CODE}" in
            0) verdict='all expectations met' ;;
            1) verdict='CONFORMANCE failure (FAIL, XPASS, level-1 rejection or canary drift — see report)' ;;
            2) verdict='no corpus generated' ;;
            3) verdict='INFRA failure — no usable level-1 tool or an INFRA outcome (NOT a conformance verdict)' ;;
            *) verdict="unknown (exit ${CODE:-n/a})" ;;
          esac
          {
            echo "## ISO/IEC 21320-1 validation (veraZIP, blocking, ${RUNNER_OS})"
            echo
            echo "Step outcome: ${OUTCOME} · exit ${CODE:-n/a} · ${verdict}"
            echo
            echo '```'
            cat verazip-report.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
            if [ -s verazip-stderr.txt ]; then
              echo
              echo '<details><summary>validator stderr</summary>'
              echo
              echo '```'
              cat verazip-stderr.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
