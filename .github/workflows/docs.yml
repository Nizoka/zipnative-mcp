# Documentation consistency
# =========================
# ci.yml already runs verify:docs inside the gate on every push and pull
# request (docs are contracts here, so `**.md` is not path-ignored there).
# This workflow is the fast, focused check a documentation-only pull request
# gets first, and the weekly drift detector: scripts/verify-docs.ts
# cross-checks every version, count and inventory quoted in the
# documentation and the agent files (AGENTS.md, CLAUDE.md, llms.txt,
# .claude/, the instructions) against the tree — the 15 tools, the wrapper
# codes, the ZIPNATIVE_MCP_* variables of server.json, the nine limits, the
# generated `.claude/rules/`.
#
# The PR job is hermetic (no network). A weekly scheduled job adds --online,
# which compares the manifest against the npm registry, so a published release
# that the docs have not caught up with surfaces on its own rather than at the
# next audit.

name: Docs

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
      - 'examples/**'
      - 'server.json'
      - '.claude/**'
      - '.github/**'
      - 'scripts/verify-docs.ts'
      - 'scripts/lib/**'
      - 'scripts/build-claude-rules.ts'
      # The parity rules cross-check documented tools, error codes and
      # operator variables against src/, so a change there can break the
      # docs without touching them.
      - 'src/**'
      - 'package.json'
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
      - 'examples/**'
      - 'server.json'
      - '.claude/**'
      - '.github/**'
      - 'scripts/verify-docs.ts'
      - 'scripts/lib/**'
      - 'scripts/build-claude-rules.ts'
      - 'src/**'
      - 'package.json'
  schedule:
    # Mondays 06:00 UTC — catch npm drift without blocking anyone's PR.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check scripts
        run: npm run typecheck:scripts

      - name: Verify documentation
        run: npm run verify:docs

  npm-drift:
    name: Check the manifest against npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on the schedule and on manual runs: a package published between a
    # PR opening and merging should not turn someone else's docs change red.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify documentation against the npm registry
        run: npx tsx scripts/verify-docs.ts --online --strict
