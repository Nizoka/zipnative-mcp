name: Dependency Review

# Blocks a pull request that introduces a dependency with a known high or
# critical vulnerability, or one under a licence outside the allow-list.
# zipnative-mcp has exactly three runtime dependencies (zipnative, the MCP SDK,
# zod), so this covers the dev toolchain and any attempt to add a fourth
# runtime one — the project's first hard rule (.github/AGENT_RULES.md rule 1).
# Apache-2.0 is on the list because the MCP SDK is licensed under it since
# 2.3 (THIRD-PARTY-NOTICES.md).
#
# Needs the repository's Dependency graph enabled (Settings → Code security).

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for comment-summary-in-pr.
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # BlueOak-1.0.0 (minimatch, under eslint / typescript-eslint) and Python-2.0 (argparse, under
          # js-yaml) are permissive licences of dev dependencies only; no runtime dependency uses them.
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, BlueOak-1.0.0, Python-2.0, Unlicense
          comment-summary-in-pr: on-failure
