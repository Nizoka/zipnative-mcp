name: Sample Regression

# Guards every tool against unintended output changes. Builds the server,
# regenerates every sample through the BUILT `tools/call` handler
# (scripts/generate-samples.ts → test-output/samples/) and fingerprints them
# against the committed chain at tests/_fixtures/samples.sha256.json.
#
# The baseline is a CHAIN, not a snapshot: every entry records the release its
# reference was captured at (`since`) and keeps it across rebaselines, so
# 1.1.0 is still held to the bytes v1.0.0 emitted. `--strict` fails on a
# sample that has no earlier reference too, so a sample cannot enter the chain
# unnoticed: a new one is declared in the release note and rebaselined.
#
# Two baseline modes. A deterministic call (a pinned `date`, the deterministic
# encoder, a fixed input archive) is a pure function of its inputs and is
# compared byte for byte (`bytes`). A call whose output carries a wall-clock
# date (an archive written without a pinned date, a JSON result that echoes
# one) can never repeat its bytes and is compared through its structure
# instead (`semantic`). The harness pins TZ=UTC and scrubs every
# ZIPNATIVE_MCP_* variable (scripts/helpers/hermetic.ts); nothing here reaches
# the network — there is no network code path to reach it with.
#
# ── Why there is no `paths:` filter ──────────────────────────────────
# This job is meant to be a REQUIRED status check. A path-filtered workflow
# simply does not run on a pull request that touches none of its paths, and a
# required check that never reports leaves the pull request stuck on
# "Expected — waiting for status to be reported", forever unmergeable. So the
# workflow always runs and decides internally whether the expensive work is
# warranted, which keeps the check reported on every pull request.
#
# Blocking on merge is a repository setting, not a file: "sample-regression"
# is listed in .github/rulesets/main.json; import that ruleset for the check
# to prevent merge.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needed to diff against the pull request's base commit.
          fetch-depth: 0

      # A zipnative bump changes bytes (the lockfile is in scope); so does
      # anything under src/, examples/, scripts/, the frozen example inputs
      # the samples read, or the baseline itself.
      - name: Decide whether emitted output can have changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${BASE}"...HEAD \
            | grep -Eq '^(src/|examples/|scripts/|tests/_fixtures/|tests/fixtures/|package\.json$|package-lock\.json$|tsconfig(\.build)?\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'No change under src/, examples/, scripts/, the fixtures or the manifests — emitted output cannot have changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts

      # The generator drives dist/server.js, never the source tree.
      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Generate samples
        if: steps.scope.outputs.run == 'true'
        run: npm run test:generate

      - name: Verify samples against the baseline chain
        if: steps.scope.outputs.run == 'true'
        run: npx tsx scripts/verify-samples.ts --strict

      - name: Report divergences
        if: failure() && steps.scope.outputs.run == 'true'
        run: |
          {
            echo '## Sample regression'
            echo
            echo 'A tracked sample no longer emits what its reference release emitted, or a new sample has no reference yet.'
            echo 'If the change is intended, say so in the release notes and rebaseline with:'
            echo
            echo '```'
            echo 'npm run build && npm run test:generate && npx tsx scripts/verify-samples.ts --update'
            echo '```'
            echo
            echo '```json'
            npx tsx scripts/verify-samples.ts --json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diverged samples on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-regression-output
          path: test-output/samples/
          retention-days: 7
