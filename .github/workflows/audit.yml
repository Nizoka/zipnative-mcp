name: Dependency Audit

# Weekly `npm audit` of the lockfile, so an advisory published between two
# pull requests is noticed without waiting for the next CI run. CI runs the
# same command on every push and pull request (ci.yml). The runtime tree
# (`--omit dev`) is audited at the lowest level: any advisory against what
# ships fails the run.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit the full tree
        run: npm audit --audit-level=high

      - name: Audit the runtime tree
        run: npm audit --omit dev --audit-level=low
