name: Node Current

# The Current Node.js line, TESTED and NOT PROMISED. package.json `engines`
# names the LTS lines the server supports, as zipnative does; a line that is
# still Current (Node 26 until 2026-10-28) runs here on every push and pull
# request, so that the day it enters LTS it joins ci.yml with a history of
# green runs behind it.
#
# Never a required check — `.github/rulesets/main.json` names the contexts
# that block a merge, and this is not one of them: a Current line breaks for
# reasons that are its own (a zlib or stream change in the runtime). There is
# deliberately no `continue-on-error: true`: it blocks nothing already, and a
# green square over a red run would hide the one thing this workflow exists
# to show.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: node-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-current:
    name: node 26 (current, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # A Current line is not in the runner's tool cache: setup-node downloads
      # it from the actions/node-versions release and falls back to nodejs.org.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the quality gate (CI profile)
        env:
          VERAZIP_REQUIRED: '1'
        run: npx tsx scripts/gate.ts --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-logs-node26
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore
