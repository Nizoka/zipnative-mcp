name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted Publishing (npmjs.com OIDC):
#   This workflow uses npm Trusted Publishing — no long-lived NPM_TOKEN secret.
#   The OIDC id-token permission mints a short-lived token that:
#     1. Authorises the `npm publish` HTTP request
#     2. Signs the provenance attestation (SLSA Level 2+ via Sigstore)
#   Configure at npmjs.com -> package settings -> Configure Trusted Publishing.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The `npm-publish` environment holds the Trusted Publishing binding (and
    # any required-reviewer rule the maintainers configure on GitHub).
    environment: npm-publish
    # `id-token: write` mints the OIDC token for Trusted Publishing + provenance.
    # `contents: write` lets the workflow attach the generated SBOM to the release.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # A range resolves to the NEWEST available Node (currently 24.x),
          # whose bundled npm >= 11.5.1 is required by npm Trusted Publishing
          # (token-less OIDC). The floor mirrors the engines >= 22 policy.
          node-version: '>=22.14.0'
          registry-url: https://registry.npmjs.org
          cache: npm

      # The publish re-runs the ENTIRE gate — a release that skips a check
      # is a release that can ship a regression. Same steps as ci.yml.
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      # Build BEFORE the tests (same order as ci.yml): the stdio suite spawns
      # dist/cli.js and the veraZIP script gate drives dist/server.js, so the
      # release gate must exercise the exact artefact that is about to be
      # published.
      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/cli.js
          test -f dist/server.js

      # Conformance gate (the analogue of pdfnative-mcp's veraPDF gate): the
      # release must never publish a server whose tools write archives the
      # ISO/IEC 21320-1 validator rejects, nor archives foreign extractors
      # cannot read. BLOCKING — same script as .github/workflows/verazip.yml.
      - name: Generate ZIP corpus
        run: npm run corpus:zip

      - name: Validate ZIP corpus (blocking)
        shell: bash
        env:
          VERAZIP_REQUIRED: '1'
          VERAZIP_REPORT_DIR: test-output/zip/reports
        run: |
          set +e
          node scripts/validate-zip.mjs > verazip-report.txt 2> verazip-stderr.txt
          code=$?
          cat verazip-report.txt
          [ -s verazip-stderr.txt ] && cat verazip-stderr.txt >&2
          exit "${code}"

      # Software Bill of Materials for supply-chain transparency. The
      # generator is the exact-pinned devDependency `@cyclonedx/cyclonedx-npm`
      # installed by `npm ci` above — `npx` resolves it from node_modules and
      # never downloads anything (no `--yes`). `--omit dev` lists only what the
      # published package pulls in at runtime (zipnative, the MCP SDK, zod).
      - name: Generate SBOM (CycloneDX)
        run: npx cyclonedx-npm --omit dev --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sbom.cdx.json --clobber

      - name: Publish
        run: npm publish --access public --provenance
