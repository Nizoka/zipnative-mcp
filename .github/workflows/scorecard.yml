name: Scorecard supply-chain security

on:
  # Run on a schedule to keep the public security posture report fresh.
  schedule:
    - cron: '27 3 * * 1'
  # Run on changes to branch protection / workflows / security files.
  push:
    branches: [main, master]

# The workflow shape scorecard-action requires when `publish_results` is on:
# read-all at the top, the writes on the one job.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed to upload the SARIF results to the Security tab.
      security-events: write
      # Needed to publish signed results to the OpenSSF public dataset.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the results to the OpenSSF Scorecard public API.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
